name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Image2PDF. Do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Upload...
        3. Click...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, commit, or Docker image version
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and whether this is a web or packaged build
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
