name: Build desktop executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: Image2PDF-Native-Windows
          - os: macos-latest
            platform: macos
            artifact: Image2PDF-Native-macOS
          - os: ubuntu-latest
            platform: linux
            artifact: Image2PDF-Native-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build native executable
        run: python create.py exe

      - name: Prepare executable, checksum, and license notices
        run: python scripts/prepare_release.py --platform ${{ matrix.platform }}

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  bundle-all-platforms:
    name: Bundle all platform builds
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all native builds
        uses: actions/download-artifact@v4
        with:
          pattern: Image2PDF-Native-*
          path: release
          merge-multiple: true

      - name: Add project license notices
        run: cp LICENSE THIRD_PARTY_NOTICES.md release/

      - name: Upload combined multi-platform build
        uses: actions/upload-artifact@v4
        with:
          name: Image2PDF-All-Platforms
          path: release
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all native builds
        uses: actions/download-artifact@v4
        with:
          pattern: Image2PDF-Native-*
          path: release
          merge-multiple: true

      - name: Add project license notices
        run: cp LICENSE THIRD_PARTY_NOTICES.md release/

      - name: Create release with direct-download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --verify-tag
          --generate-notes
          --title "Image2PDF $GITHUB_REF_NAME"
