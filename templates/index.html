<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="pageTitle">Image2PDF — המרת תמונות ל־PDF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <section class="card">
            <div class="utility-bar">
                <label for="languageSelect" data-i18n="languageLabel">שפה</label>
                <select id="languageSelect" class="language-select">
                    <option value="he">עברית</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="hero">
                <div class="logo">PDF</div>
                <div>
                    <h1 data-i18n="heroTitle">הפוך תמונות ל־PDF</h1>
                    <p data-i18n="heroDescription">בחר כמה תמונות, סדר אותן לפי הצורך והורד קובץ PDF אחד.</p>
                </div>
            </div>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form id="pdfForm" action="/create-pdf" method="post" enctype="multipart/form-data">
                <input id="languageInput" name="lang" type="hidden" value="he">
                <label id="dropZone" class="drop-zone" for="images">
                    <input
                        id="images"
                        name="images"
                        type="file"
                        accept=".jpg,.jpeg,.png,.webp,.bmp,image/jpeg,image/png,image/webp,image/bmp"
                        multiple
                        required
                    >
                    <span class="upload-icon">＋</span>
                    <strong data-i18n="chooseImages">לחץ לבחירת תמונות</strong>
                    <span data-i18n="dropImages">או גרור אותן לכאן</span>
                    <small data-i18n="fileLimits">JPG, PNG, WEBP, BMP · עד 40MB לבקשה</small>
                </label>

                <section id="previewSection" class="preview-section hidden">
                    <div class="preview-header">
                        <div>
                            <h2 data-i18n="yourImages">התמונות שלך</h2>
                            <p data-i18n="reorderHint">השתמש בחצים כדי לשנות את סדר העמודים.</p>
                        </div>
                        <div class="preview-actions">
                            <button type="button" id="reverseButton" class="secondary-button" data-i18n="reverseOrder">
                                הפוך סדר
                            </button>
                            <button type="button" id="clearButton" class="secondary-button" data-i18n="clearAll">
                                נקה הכל
                            </button>
                        </div>
                    </div>

                    <div id="previewList" class="preview-list"></div>
                </section>

                <button id="submitButton" class="primary-button" type="submit" data-i18n="createPdf" disabled>
                    צור PDF
                </button>
            </form>

            <p class="privacy-note" data-i18n="privacyNote">
                התמונות מעובדות בזיכרון בלבד ואינן נשמרות על השרת.
            </p>
        </section>
    </main>

    <div id="hoverPreview" class="hover-preview hidden" aria-hidden="true">
        <img id="hoverPreviewImage" alt="">
        <span id="hoverPreviewName"></span>
    </div>

    <div id="imageModal" class="image-modal hidden" aria-hidden="true">
        <div class="image-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <header class="modal-header">
                <div>
                    <h2 id="modalTitle" data-i18n="imagePreview">תצוגת תמונה</h2>
                    <p id="modalFileName"></p>
                </div>
                <button type="button" id="closeModalButton" class="icon-button" aria-label="סגור" data-i18n-aria-label="close">×</button>
            </header>

            <section id="viewMode" class="modal-view">
                <div class="modal-image-stage">
                    <img id="modalImage" alt="">
                </div>
                <footer class="modal-footer">
                    <button type="button" id="closeViewButton" class="secondary-button" data-i18n="close">סגור</button>
                    <button type="button" id="switchToEditButton" class="primary-action-button" data-i18n="editImage">עריכת התמונה</button>
                </footer>
            </section>

            <section id="editMode" class="editor hidden">
                <div class="editor-layout">
                    <div class="editor-stage">
                        <div id="canvasWrap" class="canvas-wrap">
                            <canvas id="editCanvas"></canvas>
                        </div>
                        <p id="cropHint" class="crop-hint hidden" data-i18n="cropHint">גרור על התמונה כדי לסמן את אזור החיתוך</p>
                    </div>

                    <aside class="editor-controls" aria-label="כלי עריכת תמונה" data-i18n-aria-label="editorTools">
                        <div class="control-group">
                            <label for="brightnessRange">
                                <span data-i18n="brightness">בהירות</span>
                                <output id="brightnessValue">100%</output>
                            </label>
                            <input id="brightnessRange" type="range" min="0" max="200" value="100">
                        </div>

                        <div class="control-group">
                            <label for="contrastRange">
                                <span data-i18n="contrast">ניגודיות</span>
                                <output id="contrastValue">100%</output>
                            </label>
                            <input id="contrastRange" type="range" min="0" max="200" value="100">
                        </div>

                        <div class="control-group">
                            <label for="saturationRange">
                                <span data-i18n="saturation">רוויה</span>
                                <output id="saturationValue">100%</output>
                            </label>
                            <input id="saturationRange" type="range" min="0" max="200" value="100">
                        </div>

                        <div class="control-group">
                            <label for="hueRange">
                                <span data-i18n="hue">גוון</span>
                                <output id="hueValue">0°</output>
                            </label>
                            <input id="hueRange" type="range" min="-180" max="180" value="0">
                        </div>

                        <div class="control-group">
                            <label for="rotationRange">
                                <span data-i18n="rotation">רוטציה</span>
                                <output id="rotationValue">0°</output>
                            </label>
                            <input id="rotationRange" type="range" min="-180" max="180" value="0">
                            <div class="quick-rotate">
                                <button type="button" id="rotateLeftButton" class="tool-button">↶ 90°</button>
                                <button type="button" id="rotateRightButton" class="tool-button">↷ 90°</button>
                            </div>
                        </div>

                        <label class="toggle-control" for="grayscaleToggle">
                            <input id="grayscaleToggle" type="checkbox">
                            <span data-i18n="grayscale">שחור־לבן</span>
                        </label>

                        <div class="crop-actions">
                            <button type="button" id="cropButton" class="tool-button" data-i18n="cropImage">חתוך תמונה</button>
                            <button type="button" id="clearCropButton" class="tool-button" data-i18n="clearCrop" disabled>בטל חיתוך</button>
                        </div>

                        <button type="button" id="resetEditButton" class="secondary-button reset-edit-button" data-i18n="resetChanges">איפוס כל השינויים</button>
                    </aside>
                </div>

                <p id="editorStatus" class="editor-status" role="status"></p>
                <footer class="modal-footer">
                    <button type="button" id="cancelEditButton" class="secondary-button" data-i18n="backToPreview">חזרה לתצוגה</button>
                    <button type="button" id="saveEditButton" class="primary-action-button" data-i18n="saveChanges">שמור שינויים</button>
                </footer>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
